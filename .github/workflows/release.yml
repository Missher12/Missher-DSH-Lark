name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'Missher12/dsh-lark'
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish verified bytes
    needs: verify
    if: github.repository == 'Missher12/dsh-lark'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-lark-canonical
          path: .work/release
      - name: Verify release bytes
        run: node scripts/verify-release.mjs .work/release/missher-dsh-lark-0.2.0.tgz .work/release/SHA256SUMS.txt
      - name: Publish GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .work/release/missher-dsh-lark-0.2.0.tgz
          .work/release/SHA256SUMS.txt
          --verify-tag
          --title "dsh-lark 0.2.0"
          --generate-notes
